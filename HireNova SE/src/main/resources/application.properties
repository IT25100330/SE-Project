spring.application.name=HireNova

# =====================================================
# SECRETS
# Passwords and keys are NOT written in this file.
# They come from secrets.properties in the project root (next to pom.xml),
# which is in .gitignore, so it is never committed or zipped.
# =====================================================
spring.config.import=optional:file:./secrets.properties

# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hirenova_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
# SQL logging is off by default; set SHOW_SQL=true in secrets.properties while debugging
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ---------- Email (Gmail SMTP) ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- JWT ----------
# Must be at least 32 characters. Changing it logs everyone out.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------- First Main Admin ----------
hirenova.admin.email=${ADMIN_EMAIL:admin@hirenova.com}
hirenova.admin.password=${ADMIN_PASSWORD:}
# true ONCE = reset the existing admin's password to ADMIN_PASSWORD, restart, then set back to false
hirenova.admin.reset-password=${ADMIN_RESET_PASSWORD:false}

hirenova.frontend-url=http://127.0.0.1:5500/Frontend


# ---------- File uploads (validation) ----------
# CVs can be up to 5 MB (before, Spring's 1 MB default rejected them first with an unclear error)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB